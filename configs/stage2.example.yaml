stage: 2
device: auto
initialize_from_stage1: runs/stage1/last.pt
model:
  image_size: 224
  patch_size: 16
  vocab_size: 64010
  visual_vocab_size: 8192
  max_text_length: 256
  hidden_size: 1024
  depth: 24
  num_heads: 16
  intermediate_size: 4096
  gradient_checkpointing: true
  drop_path_rate: 0.1
tokenizer:
  kind: sentencepiece
  model_path: /path/to/medical_sentencepiece.model
  max_length: 256
  cls_id: 0  # illustrative only: verify the actual CLS piece and ID
  pad_id: 1  # illustrative only: verify the actual piece and ID
  mask_id: 2  # illustrative only: verify the actual piece and ID
  eos_id: 3  # illustrative only: verify the actual piece and ID
data:
  manifest: /path/to/stage2.jsonl
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
stage2:
  projection_dim: 1024
  initial_temperature: 0.07
distillation:
  weight: 1.0
  teachers:
    pathology:
      UNI: {dim: 1024, weight: 1.0}
      CONCH: {dim: 512, weight: 1.0}
      GPFM: {dim: 1024, weight: 1.0}
    radiology:
      KAD: {dim: 768, weight: 1.0}
      CARZero: {dim: 768, weight: 1.0}
      Ark: {dim: 768, weight: 1.0}
training:
  steps: 100000
  batch_size: 8
  gradient_accumulation: 1
  num_workers: 4
  seed: 42
  lr: 0.0001
  min_lr: 0.000001
  warmup_steps: 1000
  weight_decay: 0.04
  weight_decay_end: 0.4
  grad_clip: 3.0
  amp: true
  log_every: 10
  save_every: 1000
  output_dir: runs/stage2
